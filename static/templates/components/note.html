<li class="note">
    <form class="delete-form" action="/delete" method="POST">
        <input type="hidden" name="id" value="{id}">
        <button class="delete-button" type="submit" name="delete_button" aria-label="Excluir nota">&times;</button>
    </form>
    <h3>{title}</h3>
    <p>{details}</p>
    <a class="edit-button" name="edit_button" href="/update/{id}">Editar</a>
</li>
